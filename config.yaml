# Example config for the PloidyScope workflow
#
# `input_table` should be a single recoded table sorted by chromosome and position.
# The expected columns are:
# pop, ploidy, chromosome, position, an, dp, genotype_1, genotype_2, ...
#
# You can generate this table from upstream preprocessing or by
# concatenating population-specific recoded tables in chromosome/position order.

input_table: data/example.recoded.tsv
outdir: results/ploidyscope
stats:
	- rho
window_size: 100000
minimum_snps: 2
populations: []
