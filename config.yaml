# Example config for the PloidyScope workflow.
#
# Choose exactly one input mode:
# 1. `input_vcf` + `population_map`
# 2. `input_table`
#
# Population map format: two columns with sample and population.

input_vcf: data/example.vcf.gz
population_map: data/populations.tsv
# input_table: data/example.recoded.tsv
outdir: results/ploidyscope
stats:
	- rho
	# Supported values: rho, dxy, pi, tajima_d, hudson
window_size: 100000
minimum_snps: 2
populations: []
